<html lang="ar" dir="rtl">
<head>

<title>تقويم | الأستاذ خليفة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#0a1f18;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:560px}
.box{background:#123026;border:2px solid #f39c12;border-radius:20px;padding:18px;margin-top:10px}
h1{text-align:center;color:#f1c40f;font-size:1.35rem;margin-top:8px;line-height:1.6}
.sub{text-align:center;color:#ccc;font-size:.9rem}
.big{font-size:3.4rem;text-align:center;margin:8px 0}
p.t{text-align:center;line-height:1.9;color:#ddd;margin:8px 0}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer;margin-top:14px}
#game{display:none}
#snd{position:fixed;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:#123026;border:1px solid #f39c12;font-size:1.1rem;cursor:pointer;color:#fff;z-index:5}
.top{display:flex;justify-content:space-between;font-weight:800;color:#f1c40f;margin-bottom:8px}
.bar{height:10px;background:#0a1f18;border-radius:8px;overflow:hidden;margin-bottom:8px}
.bar>div{height:100%;width:0;background:#f1c40f;transition:width .3s}
#tb{background:#e74c3c;width:100%}
.sec{text-align:center;color:#7fd1ae;font-size:.85rem;font-weight:700;margin-top:4px}
.q{font-size:1.25rem;font-weight:800;text-align:center;margin:14px 0;min-height:70px;display:flex;align-items:center;justify-content:center;line-height:1.9}
.q.long{font-size:1.02rem;font-weight:700;text-align:right;justify-content:flex-start;line-height:2}
.ops{display:grid;gap:11px}
.op{border:0;border-radius:16px;padding:15px;font-size:1.08rem;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.op:active{transform:translateY(3px)}
.c0{background:#e74c3c}.c1{background:#2980b9}.c2{background:#d68910}.c3{background:#27ae60}
.op.sel{outline:4px solid #fff;transform:scale(.97)}
.op:disabled{opacity:.6}
.pop{animation:pop .35s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.urgent{color:#e74c3c}
</style>
</head>
<body>

<div class="app">

<p class="t">اقرأ السؤال جيداً ثم اختر الإجابة الصحيحة بالضغط عليها، ولا يمكنك التراجع بعد الاختيار.<br>في النهاية تحصل على <b>قسيمة</b> تُضاف بها نقاطك في منصة مكافآت.</p>

<script src="https://splendorous-biscuit-4ecc2d.netlify.app/mk.js"></script>
<script>
/* ===== هذا هو الجزء الوحيد الذي تغيّره في كل تقويم جديد ===== */
const LESSON_ID = `lesson2`;   // نفس الرمز المسجّل في لوحة الأستاذ
const TITLE = `تقويم خصائص الشريعة وعلم التفسير`;
const SECTIONS = [`القسم الأول: خصائص الشريعة الإسلامية`, `القسم الثاني: مدخل إلى علم التفسير`];
const QUESTIONS = [ // s = رقم القسم. الإجابة الصحيحة لا توضع هنا، بل في لوحة الأستاذ
{s:0,q:`قال تعالى: ﴿الَّذِينَ يَتَّبِعُونَ الرَّسُولَ النَّبِيَّ الْأُمِّيَّ الَّذِي يَجِدُونَهُ مَكْتُوبًا عِنْدَهُمْ فِي التَّوْرَاةِ وَالْإِنْجِيلِ يَأْمُرُهُمْ بِالْمَعْرُوفِ وَيَنْهَاهُمْ عَنِ الْمُنْكَرِ وَيُحِلُّ لَهُمُ الطَّيِّبَاتِ وَيُحَرِّمُ عَلَيْهِمُ الْخَبَائِثَ وَيَضَعُ عَنْهُمْ إِصْرَهُمْ وَالْأَغْلَالَ الَّتِي كَانَتْ عَلَيْهِمْ﴾ [الأعراف: 157]. تدل عبارة ﴿وَيَضَعُ عَنْهُمْ إِصْرَهُمْ وَالْأَغْلَالَ﴾ على خاصية:`,o:[`الشمولية`,`اليسر ورفع الحرج`,`العالمية`,`الثبات والمرونة`]},
{s:0,q:`عن عائشة رضي الله عنها أن النبي صلى الله عليه وسلم قال: «أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ»، وكان إذا عمل عملاً أثبته، ونهى عن الإجهاد في العبادة حتى لا يمل الإنسان. المبدأ المنصوص عليه في الحديث يمثل تطبيقاً لخاصية:`,o:[`ربانية المصدر`,`الشمولية`,`التوسط والاعتدال`,`الثبات والمرونة`]},
{s:0,q:`قال تعالى: ﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ﴾ [البقرة: 173]. تجسد هذه الآية الكريمة التفاعل بين خصائص الشريعة، ويظهر فيها بوضوح خاصية:`,o:[`العالمية`,`الشمولية`,`الثبات والمرونة`,`ربانية الغاية`]},
{s:0,q:`كتب عمر بن الخطاب رضي الله عنه إلى أبي موسى الأشعري: «لا يَمْنَعَنَّكَ قَضَاءٌ قَضَيْتَهُ بِالأَمْسِ، فَرَاجَعْتَ فِيهِ نَفْسَكَ، وَهُدِيتَ فِيهِ لِرُشْدِكَ، أَنْ تَرْجِعَ فِيهِ إِلَى الْحَقِّ». يعد هذا المبدأ الفقهي تطبيقاً لخاصية:`,o:[`المرونة`,`المثالية`,`ربانية المصدر`,`العالمية`]},
{s:0,q:`جمع التشريع الإسلامي في معالجة الانحرافات بين غرس التقوى والرقابة الذاتية، وبين إقامة الحدود والتعزيرات الزجرية. هذا التكامل يجسد خاصية:`,o:[`اليسر ورفع الحرج`,`الشمولية`,`العالمية`,`الثبات`]},
{s:0,q:`قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى الْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالأُنْثَى بِالأُنْثَى فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ﴾ [البقرة: 178]. تجمع هذه الآية الكريمة بين أصلين تشريعيين يعبران عن خاصية:`,o:[`الواقعية والمثالية`,`الشمولية`,`العالمية`,`اليسر ورفع الحرج`]},
{s:0,q:`قام خطيب الجمعة بتوضيح أن أحكام الشريعة لا تفرق بين أبيض وأسود، ولا تنحصر في بيئة جغرافية محددة دون غيرها. المفهوم الذي يتحدث عنه الخطيب هو خاصية:`,o:[`التوسط والاعتدال`,`العالمية`,`الشمولية`,`الواقعية`]},
{s:0,q:`يعتمد الفقهاء في استنباط الأحكام للنوازل المعاصرة على قواعد كلية مثل: «المشقة تجلب التيسير» و«الضرر يزال». اعتماد الشريعة على هذه القواعد يعكس خاصية:`,o:[`الشمولية`,`الثبات والمرونة`,`المثالية الخالصة`,`ربانية المصدر`]},
{s:0,q:`قال تعالى: ﴿وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ وَلَا تَنْسَ نَصِيبَكَ مِنَ الدُّنْيَا﴾ [القصص: 77]. التوجيه الإلهي في الآية الكريمة يمثل جوهر خاصية:`,o:[`التوسط والاعتدال`,`الثبات`,`اليسر ورفع الحرج`,`العالمية`]},
{s:0,q:`حددت الشريعة الإسلامية المقادير الثابتة في الزكاة والفرائض (المواريث)، بينما تركت أساليب إدارة أموال الدولة وتنظيم المعاملات التجارية المستجدة لاجتهاد العلماء والمصلحة المعتبرة. هذا التوزيع الدقيق يعبر عن خاصية:`,o:[`الشمولية المطلقة`,`الثبات والمرونة`,`الواقعية والمثالية`,`ربانية الغاية`]},

{s:1,q:`قال تعالى: ﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾ [الفاتحة: 6]. جاء في كتب التفسير عند شرح هذه الآية: «الصراط المستقيم هو القرآن، والدليل ما رواه الترمذي عن علي رضي الله عنه مرفوعاً عن النبي صلى الله عليه وسلم أنه قال في القرآن: (وهو الصراط المستقيم)». هذا المنهج المتبع في التفسير يُمثل:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا﴾ [المائدة: 38]. جاء في تفاسير الأحكام: «اليد في لسان العرب تُطلق على الكف، وعلى الذراع إلى المرفق، وعلى اليد كاملة، وقد جاءت السنة النبوية الثابتة وأقوال الصحابة لتبيان وتحديد محل القطع بدقة دون الخروج عن مقتضى دلالة اللفظ العربي». هذا الصنيع يعتمد على:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ﴾ [المائدة: 6]. من منهج الإمام ابن كثير في تفسيره لهذه الآية: استدل بها الأئمة على وجوب النية، واعتمدوا في بيان الأحكام على ما ورد في الصحيحين عن رسول الله صلى الله عليه وسلم: «إنما الأعمال بالنيات» مع تتبع الروايات المرفوعة. هذا النموذج يمثل:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿الم﴾ [البقرة: 1]. عند النظر في طريقة كتاب تفسير الجلالين عند التعامل مع هذه الحروف، يكتفي بالقول: «الله أعلم بمراده بذلك». وفي بقية الآيات يعتمد على الاختصار المعنوي والاجتهاد اللغوي القريب دون التوسع في سرد الروايات أو الأحاديث. هذا المنهج يندرج تحت:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿وَأَعِدُّوا لَهُمْ مَا اسْتَطَعْتُمْ مِنْ قُوَّةٍ﴾ [الأنفال: 60]. من منهج كتاب أيسر التفاسير: القوة تشمل كل ما يُتقوى به في الحرب، وقد صح عن النبي صلى الله عليه وسلم أنه قال: «ألا إن القوة الرمي»، ويدخل في معنى القوة في كل زمان ما يناسبه من الأسلحة والتقنيات الحديثة المستنبطة بحسب الحاجة والمصلحة. هذه الطريقة في الشرح تعكس:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿وَالْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ لِتَرْكَبُوهَا وَزِينَةً وَيَخْلُقُ مَا لَا تَعْلَمُونَ﴾ [النحل: 8]. من منهج كتاب التحرير والتنوير للطاهر بن عاشور: الجملة فيها إشارة بليغة إلى ما سيخلقه الله من وسائل النقل الحديثة كالسيارات والقطارات، مستعيناً بقواعد اللغة وبلاغتها وبالنظر العقلي في مقاصد الآية. يمثل هذا المسار:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ﴾ [البقرة: 43]. عندما يُفسر أحدهم الآية بالاعتماد على قواعد دلالات الألفاظ عند الأصوليين، كاعتبار أن صيغة الأمر تدل على الوجوب. هذا الأسلوب في التفسير يمثل:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ﴾ [البقرة: 37]. فسر المفسر هذه «الكلمات» بالرجوع إلى قوله تعالى في سورة الأعراف: ﴿رَبَّنَا ظَلَمْنَا أَنْفُسَنَا...﴾، معتمداً على الآيات نفسها في بيان مراد الله. هذا الصنيع يُعد تطبيقاً عملياً لـ:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`قال تعالى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾ [البقرة: 275]. عندما يعمد مفسر معاصر عند شرح هذه الآية إلى إثبات ما ورد في النصوص والآثار أولاً، ثم يستثمر قواعد الفقه واللغة والاجتهاد العقلي المنضبط لمعالجة النوازل المعاصرة المستجدة. هذا المنهج المزدوج يمثل:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]},
{s:1,q:`إذا فتحت كتاباً في التفسير فوجدت مؤلفه يحرص أشد الحرص على تعقب الأسانيد ونقل أقوال السلف من الصحابة والتابعين، ويحذر من إدخال الإسرائيليات أو الآثار الواهية قبل فحصها رواية ودراية. فإن هذا الكتاب يمثل منهج:`,o:[`التفسير بالمأثور`,`التفسير بالرأي`,`التفسير الجامع بينهما`]}
];
/* ================================================================ */

/* الأصوات: تُولَّد من المتصفح، بلا ملفات */
const Snd = (() => {
  let ctx = null, on = true;
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (f, d, type = 'sine', v = .15, t0 = 0, f2) => {
    if (!on) return; const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
  };
  return {
    unlock: ac,
    tap() { tone(660, .08, 'square', .1); },
    next() { tone(440, .1, 'triangle', .12); tone(660, .12, 'triangle', .12, .08); },
    tick() { tone(1000, .05, 'square', .08); },
    time() { tone(220, .4, 'sawtooth', .14, 0, 90); },
    go() { [392, 523, 659, 784].forEach((f, i) => tone(f, .15, 'triangle', .14, i * .1)); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, 'triangle', .16, i * .14)); tone(1318, .5, 'triangle', .14, .6); },
    toggle() { on = !on; return on; }
  };
})();

const $ = id => document.getElementById(id);
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// الوقت يتناسب مع طول السؤال: من 30 إلى 75 ثانية
const timeFor = it => { const n = it.q.length + it.o.reduce((a, x) => a + x.t.length, 0); return Math.min(75, Math.max(30, 20 + Math.ceil(n / 12))); };
let items = [], ans = [], cur = 0, tm = null, locked = false, left = 0;

$('ttl').textContent = '🎮 ' + TITLE;
$('info').textContent = QUESTIONS.length + ' سؤالاً في ' + SECTIONS.length + ' أقسام، والوقت لكل سؤال يتناسب مع طوله.';

function start() {
  Snd.unlock();
  if (window.MK) MK.ask(begin, LESSON_ID); else begin();
}

function begin() {
  Snd.go();
  items = [];
  SECTIONS.forEach((_, si) => {   // الأقسام بالترتيب، والخلط داخل كل قسم فقط
    items = items.concat(shuf(QUESTIONS
      .map((x, i) => ({ i, s: x.s, q: x.q, o: shuf(x.o.map((t, j) => ({ t, n: j + 1 }))) }))
      .filter(x => x.s === si)));
  });
  ans = new Array(QUESTIONS.length).fill("0");
  cur = 0;
  $('intro').style.display = 'none';
  $('game').style.display = 'block';
  nextQ();
}

function nextQ() {
  clearInterval(tm); locked = false;
  if (cur >= items.length) return end();
  const it = items[cur], T = timeFor(it);
  $('cnt').textContent = 'السؤال ' + (cur + 1) + ' من ' + items.length;
  $('pb').style.width = (cur / items.length * 100) + '%';
  $('sec').textContent = SECTIONS[it.s];
  const q = $('qt'); q.textContent = it.q;
  q.className = 'q' + (it.q.length > 140 ? ' long' : ''); void q.offsetWidth; q.classList.add('pop');
  const box = $('ops'); box.innerHTML = '';
  it.o.forEach((x, k) => {
    const b = document.createElement('button');
    b.className = 'op c' + (k % 4); b.textContent = x.t;
    b.onclick = () => { Snd.tap(); pick(b, String(x.n)); };
    box.appendChild(b);
  });
  left = T; $('tm').textContent = '⏱️ ' + left; $('tm').classList.remove('urgent');
  const tb = $('tb'); tb.style.transition = 'none'; tb.style.width = '100%'; void tb.offsetWidth;
  tb.style.transition = 'width ' + T + 's linear'; tb.style.width = '0%';
  tm = setInterval(() => {
    left--; $('tm').textContent = '⏱️ ' + Math.max(left, 0);
    if (left > 0 && left <= 5) { Snd.tick(); $('tm').classList.add('urgent'); }
    if (left <= 0) { Snd.time(); pick(null, "0"); }
  }, 1000);
}

function pick(btn, n) {
  if (locked) return; locked = true; clearInterval(tm);
  ans[items[cur].i] = n;            // الإجابة تُحفظ بحسب ترتيب السؤال الأصلي
  if (btn) btn.classList.add('sel');
  document.querySelectorAll('.op').forEach(b => b.disabled = true);
  setTimeout(() => { cur++; if (cur < items.length) Snd.next(); nextQ(); }, 550);
}

function end() {
  Snd.win();
  $('pb').style.width = '100%';
  $('game').innerHTML = '<div class="big">🏁</div><p class="t">انتهى التقويم! جاري تصحيح إجاباتك...</p>';
  setTimeout(() => {
    if (window.MK) MK.finish(LESSON_ID, ans);
    else $('game').innerHTML += '<p class="t">تعذّر الاتصال بالمنصة، أعد تحميل الصفحة.</p>';
  }, 900);
}
</script>
</body>
</html>
